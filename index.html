<!DOCTYPE html>
<html lang="en" class="light scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Paper Straw</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols: subset to only the icons used, pinned axes (wght 400 / FILL 0),
         display=block so glyphs never render as raw ligature text before the font loads. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=album,arrow_forward,chevron_right,close,download,folder_zip,history,keyboard_arrow_down,location_on,menu,music_note,open_in_new,photo_camera,play_arrow,play_circle,smart_display,swipe&display=block"
      rel="stylesheet"
    />

    <!-- Tailwind CSS -->
    <style>
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }
      body {
        font-family: 'Libre Baskerville', serif;
      }
      h1, h2, h3, h4, h5, h6, .font-display {
        font-family: 'Young Serif', serif;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
<script>
  // The site used to run on a hash router, so links and QR codes shared before
  // the switch look like /#/news. Send those to the clean path before the app
  // mounts, or they would all land on the homepage. Any query the hash carried
  // rides along, since it is part of the string being handed to replace().
  // In-page anchors like #signup do not start with "#/" and are left alone.
  (function () {
    var hash = window.location.hash;
    if (hash.slice(0, 2) === '#/') window.location.replace(hash.slice(1));
  })();
</script>
</head>
  <body class="bg-background-light dark:bg-background-dark text-text-main font-body antialiased overflow-x-hidden">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
